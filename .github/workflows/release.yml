name: Build and release packages

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          sh tests/test_package_layout.sh
          sh tests/test_agent_runtime_cli.sh

  sdk-build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenWrt 24.10 IPK aarch64
            sdk_arch: aarch64_cortex-a53-24.10.7
            target_arch: aarch64_cortex-a53
            extension: ipk
          - name: OpenWrt 24.10 IPK x86_64
            sdk_arch: x86_64-24.10.7
            target_arch: x86_64
            extension: ipk
          - name: OpenWrt snapshot APK aarch64
            sdk_arch: aarch64_cortex-a53-master
            target_arch: aarch64_cortex-a53
            extension: apk
          - name: OpenWrt snapshot APK x86_64
            sdk_arch: x86_64-master
            target_arch: x86_64
            extension: apk
    steps:
      - uses: actions/checkout@v4

      - name: Stage this repository as a feed
        run: |
          set -euo pipefail
          mkdir -p sdk-artifacts release-assets
          # Feed root is the repository checkout itself (a real git repo),
          # the standard gh-action-sdk layout: packages/*/<pkg>/Makefile.
          # Tar-staging into .sdk-feed excluded .git, which broke the SDK's
          # git-based checks and made feeds scan skip luci-app packages.

      - name: Build SDK packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk_arch }}
          ARTIFACTS_DIR: ${{ github.workspace }}/sdk-artifacts
          BUILD_LOG: 1
          FEED_DIR: ${{ github.workspace }}
          FEEDNAME: agent_runtime
          INDEX: 1
          PACKAGES: agent-runtime luci-app-agent-runtime
          KEY_BUILD: ${{ secrets.IPK_SIGNING_KEY }}
          PRIVATE_KEY: ${{ secrets.APK_SIGNING_KEY }}
          V: s

      - name: Collect and verify SDK output
        run: |
          set -euo pipefail
          found="$(find sdk-artifacts -type f -name "*.${{ matrix.extension }}" -print)"
          test -n "$found"
          printf '%s\n' "$found" | grep -E '/(agent-runtime|luci-app-agent-runtime)(_|-)[^/]+\.${{ matrix.extension }}$'
          target="release-assets/${{ matrix.extension }}-${{ matrix.target_arch }}"
          mkdir -p "$target"
          # Copy only our two packages (and nothing else from bin/packages,
          # which also holds base/packages feed ipks/apks such as zlib).
          find sdk-artifacts -type f \( -name "agent-runtime*.${{ matrix.extension }}" -o -name "luci-app-agent-runtime*.${{ matrix.extension }}" \) -exec cp {} "$target" \;
          (cd "$target" && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: agent-runtime-${{ matrix.extension }}-${{ matrix.target_arch }}
          path: release-assets/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-runtime-build-log-${{ matrix.extension }}-${{ matrix.target_arch }}
          path: sdk-artifacts/logs/
          if-no-files-found: warn

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: sdk-build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-runtime-ipk-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-runtime-apk-*
          path: release-assets
          merge-multiple: true
      - name: Verify release asset matrix
        run: |
          set -euo pipefail
          find release-assets -type f -name '*.ipk' -print
          find release-assets -type f -name '*.apk' -print
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find release-assets -type f \( -name '*.ipk' -o -name '*.apk' \) -exec sha256sum {} \; | sort -k2 > release-assets/SHA256SUMS
          # shellcheck disable=SC2086
          assets=$(find release-assets -type f \( -name '*.ipk' -o -name '*.apk' -o -name SHA256SUMS \) -print | tr '\n' ' ')
          gh release create "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY" || true
          for i in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" $assets --clobber --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "upload attempt $i failed, retrying..."
            sleep 5
          done
          echo "release upload failed after 5 attempts" >&2
          exit 1
